<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog App</title>
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#1c1c1a;--mut:#6f6f69;--line:#e6e4dc;--acc:#1f6f5c;--acc-ink:#fff;--acc-soft:#e3f1ec;--danger:#b3261e;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--ink:#ecece6;--mut:#9a9a92;--line:#2f2f2b;--acc:#4cc2a5;--acc-ink:#0e1f1a;--acc-soft:#1b2e28;--danger:#f2776f;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 0}
h1{display:flex;align-items:center;gap:10px;font:700 20px Georgia,serif;margin:0}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font:700 16px Georgia,serif}
#auth{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
#auth label{color:var(--mut)}
#auth input{width:70px;padding:6px 10px}
.who{display:flex;align-items:center;gap:8px}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font:600 13px system-ui;flex:none}
h2{font:700 22px/1.3 Georgia,serif;margin:12px 0 6px}
h3{margin:0;font:600 15px system-ui}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:.15s}
button:hover{filter:brightness(1.08)}
button.ghost,.bar button,.chip{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
button.ghost:hover,.bar button:hover,.chip:hover{border-color:var(--acc);background:var(--acc-soft);filter:none}
.bar button.on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.bar .danger{color:var(--danger);margin-left:auto}
.bar .danger:hover{border-color:var(--danger);background:transparent}
.chip{padding:2px 12px;font-size:13px;margin-left:auto}
input,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:100px;resize:vertical;font-family:Georgia,serif}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center}
.box,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.card{transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.box{display:grid;gap:10px}
.meta{display:flex;align-items:center;gap:10px}
.who2{display:flex;flex-direction:column;line-height:1.25;font-size:14px}
.who2 span{color:var(--mut);font-size:13px}
.body{white-space:pre-wrap;margin:0 0 14px;font:17px/1.7 Georgia,serif;overflow-wrap:anywhere}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar button{padding:5px 14px}
.cm{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.cm .c{display:flex;gap:8px;margin-bottom:8px}
.cm .c b{white-space:nowrap}
.cm .cf{margin-top:10px}
.empty{color:var(--mut);text-align:center;margin:28px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:10px}
footer{padding:16px 0 56px;font-size:13px;color:var(--mut)}
footer summary{cursor:pointer;width:max-content}
footer form{margin-top:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--danger);color:#fff}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1><span class="logo">B</span>Blog App</h1>
  <div id="auth" class="row"></div>
</div></header>

<main class="wrap">
  <form id="compose" class="box" hidden>
    <h3>Write a new post</h3>
    <input name="title" placeholder="Post title" required>
    <textarea name="content" placeholder="Write something worth reading…" required></textarea>
    <div><button>Publish</button></div>
  </form>
  <section id="feed"><p class="empty">Loading…</p></section>
  <footer><details><summary>Settings</summary>
    <form id="cfg" class="row"><label for="api">API address</label><input id="api" name="api" required><button class="ghost">Save</button></form>
  </details></footer>
</main>

<dialog id="dlg">
  <form id="suf">
    <h2>Create account</h2>
    <input name="name" placeholder="Full name" required>
    <input name="username" placeholder="Username" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <input name="bio" placeholder="Short bio (optional)">
    <div class="row"><button>Sign up</button><button type="button" id="cancel" class="ghost">Cancel</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
let base = S.get('api') || (location.port === '8000' ? location.origin : 'http://127.0.0.1:8000'), me = null;
const users = {}, liked = new Set(), following = new Set();

function toast(m, bad) {
  const t = $('#toast');
  t.textContent = m; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200);
}

async function api(p, o = {}) {
  let r;
  try { r = await fetch(base + p, { headers: { 'Content-Type': 'application/json' }, ...o }); }
  catch (e) { throw new Error('Cannot reach ' + base + '. Is the server running, with CORS enabled?'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = Array.isArray(d.detail) ? d.detail.map(x => x.loc.slice(-1) + ': ' + x.msg).join(', ') : d.detail;
    throw new Error(m || 'Request failed (' + r.status + ')');
  }
  return d;
}
const post = (p, b) => api(p, { method: 'POST', body: b ? JSON.stringify(b) : undefined });

async function user(id) {
  if (!users[id]) {
    try { users[id] = await api('/user?user_id=' + id); }
    catch (e) { users[id] = { id, name: 'Unknown', username: 'unknown' }; }
  }
  return users[id];
}

function renderAuth() {
  $('#auth').innerHTML = `<span class="who"><span class="av" id="avm"></span><b id="who"></b></span><label for="acting">User ID</label><input id="acting" type="number" min="1" value="${actingId}"><button id="su" class="ghost">+ New user</button>`;
  $('#compose').hidden = !me;
}

let actingId = +S.get('acting') || 1;
async function pickUser(id) {
  actingId = id; S.set('acting', id);
  try { me = await api('/user?user_id=' + id); users[id] = me; } catch (e) { me = null; }
  $('#who').textContent = me ? me.name : 'No such user';
  $('#avm').textContent = me ? ini(me.name) : '?'; $('#avm').style.background = hue(id);
  $('#compose').hidden = !me;
  load();
}

const ini = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const hue = id => `hsl(${(id * 47) % 360} 45% 40%)`;
const card = b => {
  const u = users[b.author_id] || {}, mine = me && me.id === b.author_id;
  return `<article class="card" data-id="${b.id}" data-author="${b.author_id}">
    <div class="meta"><span class="av" style="background:${hue(b.author_id)}">${esc(ini(u.name))}</span>
      <div class="who2"><b>${esc(u.name)}</b><span>@${esc(u.username)}</span></div>
      ${me && !mine ? `<button class="chip" data-a="follow">${following.has(b.author_id) ? 'Following' : 'Follow'}</button>` : ''}</div>
    <h2>${esc(b.title)}</h2>
    <p class="body">${esc(b.content)}</p>
    <div class="bar">
      <button data-a="like" class="${liked.has(b.id) ? 'on' : ''}">♥ ${b.likes_count}</button>
      <button data-a="cm">Comments ${b.comments_count}</button>
      ${mine ? '<button data-a="del" class="danger">Delete</button>' : ''}
    </div>
    <div class="cm" hidden></div>
  </article>`;
};

async function load() {
  const f = $('#feed');
  try {
    const blogs = await api('/blogs');
    await Promise.all([...new Set(blogs.map(b => b.author_id))].map(user));
    f.innerHTML = blogs.length ? blogs.slice().reverse().map(card).join('') : '<p class="empty">No posts yet. Be the first to write one.</p>';
  } catch (e) { f.innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

async function refresh(c) {
  const id = +c.dataset.id, d = await api('/blog?blog_id=' + id);
  const l = c.querySelector('[data-a=like]');
  l.textContent = '♥ ' + d.likes_count; l.classList.toggle('on', liked.has(id));
  c.querySelector('[data-a=cm]').textContent = 'Comments ' + d.comments_count;
}

async function comments(c) {
  const list = await api(`/blog/${c.dataset.id}/comments`);
  await Promise.all([...new Set(list.map(x => x.commenter_id))].map(user));
  c.querySelector('.cm').innerHTML =
    (list.length ? list.map(x => `<div class="c"><b>${esc(users[x.commenter_id].name)}</b><span>${esc(x.text)}</span></div>`).join('') : '<p class="empty">No comments yet.</p>') +
    (me ? '<form class="row cf"><input name="text" placeholder="Write a comment" required><button>Post</button></form>' : '<p class="empty">Enter a valid user ID at the top to comment.</p>');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  
  if (b.id === 'su') return $('#dlg').showModal();
  if (b.id === 'cancel') return $('#dlg').close();
  const a = b.dataset.a, c = b.closest('.card'); if (!a || !c) return;
  const id = +c.dataset.id, aid = +c.dataset.author;
  try {
    if (a === 'like') {
      if (!me) return toast('Enter a valid user ID at the top first', 1);
      const r = await post(`/blog/${id}/like?user_id=${me.id}`);
      r.liked ? liked.add(id) : liked.delete(id);
      await refresh(c);
    } else if (a === 'follow') {
      const r = await post(`/user/${aid}/follow?current_user_id=${me.id}`);
      r.following ? following.add(aid) : following.delete(aid);
      document.querySelectorAll(`.card[data-author="${aid}"] [data-a=follow]`).forEach(x => x.textContent = r.following ? 'Following' : 'Follow');
    } else if (a === 'cm') {
      const p = c.querySelector('.cm'); p.hidden = !p.hidden;
      if (!p.hidden) await comments(c);
    } else if (a === 'del') {
      if (!confirm('Delete this post?')) return;
      await api('/blog?blog_id=' + id, { method: 'DELETE' });
      c.remove(); toast('Post deleted');
    }
  } catch (err) { toast(err.message, 1); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'suf') {
      const u = await post('/user', { name: d.name, username: d.username, email: d.email, password: d.password, bio: d.bio || null });
      $('#dlg').close(); f.reset(); $('#acting').value = u.id; await pickUser(u.id); toast('User created. Now posting as ' + u.name + ' (ID ' + u.id + ')');
    } else if (f.id === 'compose') {
      await post('/blog', { title: d.title, content: d.content, author_id: me.id });
      f.reset(); toast('Published'); load();
    } else if (f.classList.contains('cf')) {
      const c = f.closest('.card');
      await post(`/blog/${c.dataset.id}/comment`, { text: d.text, commenter_id: me.id });
      await comments(c); refresh(c);
    } else if (f.id === 'cfg') {
      base = d.api.trim().replace(/\/$/, ''); S.set('api', base); toast('Saved'); load();
    }
  } catch (err) { toast(err.message, 1); }
});

document.addEventListener('change', e => { if (e.target.id === 'acting' && +e.target.value > 0) pickUser(+e.target.value); });

(async () => {
  $('#api').value = base;
  renderAuth(); await pickUser(actingId);
})();
</script>
</body>
</html>
