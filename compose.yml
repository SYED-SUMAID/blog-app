services:

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    networks:
      - blog-network

    restart: unless-stopped


  # PostgreSQL Database
  db:
    image: postgres:17-alpine

    container_name: blog-database

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - blog-network

    restart: unless-stopped


  # Nginx Load Balancer
  load-balancer:
    image: nginx:1.28-alpine

    container_name: blog-load-balancer

    ports:
      - "8000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy
        
    networks:
      - blog-network

    restart: unless-stopped


  # Frontend
  frontend:
    image: nginx:alpine

    container_name: blog-frontend

    ports:
      - "5500:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    networks:
      - blog-network

    restart: unless-stopped


# Persistent Storage
volumes:
  postgres_data:


# Custom Network
networks:
  blog-network:
    driver: bridge